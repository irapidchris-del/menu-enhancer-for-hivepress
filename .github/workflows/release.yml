name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.6)'
        required: true
      notes:
        description: 'Release notes (Markdown, optional, auto-generated if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/account-menu-enhancer-for-hivepress
          # changelog.txt carries every release before 3.3.8, moved out of
          # readme.txt in 3.3.14 to get the changelog under WordPress's
          # 5,000-character cap on the update screen. It is named here because
          # a file that is not named is silently absent from the zip while
          # every local test still passes - and the readme points at it.
          cp account-menu-enhancer-for-hivepress.php uninstall.php readme.txt changelog.txt license.txt build/account-menu-enhancer-for-hivepress/
          cp -r includes assets languages build/account-menu-enhancer-for-hivepress/
          cd build
          zip -r account-menu-enhancer-for-hivepress.zip account-menu-enhancer-for-hivepress

      - name: Create or refresh the release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "$TAG" build/account-menu-enhancer-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" build/account-menu-enhancer-for-hivepress.zip --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/account-menu-enhancer-for-hivepress.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload asset to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/account-menu-enhancer-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
